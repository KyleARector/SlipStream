name: ci

on:
  push:
  pull_request:

jobs:
  host-unity:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run host unit tests
        run: make -C test/host test

  firmware:
    name: Firmware build (esp32s3)
    runs-on: ubuntu-latest
    needs: host-unity
    steps:
      - uses: actions/checkout@v4

      - name: idf.py build (esp32s3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
